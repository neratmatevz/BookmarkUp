<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BookmarkUp</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/settings.css" />
    <link rel="stylesheet" href="styles/about.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="../../icons/icon-32.png" width="20" height="20" alt="" />
        <h1>BookmarkUp</h1>
      </div>
      <div class="header-actions">
        <button
          type="button"
          id="about-open"
          class="icon-btn"
          aria-label="About extension"
          title="About extension"
          data-i18n-attr="aria-label:aboutTitle,title:aboutTitle"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
          </svg>
        </button>
        <button
          type="button"
          id="settings-open"
          class="icon-btn"
          aria-label="Settings"
          title="Settings"
          data-i18n-attr="aria-label:settings,title:settings"
        >
          <span aria-hidden="true">⚙</span>
        </button>
      </div>
    </header>

    <!-- Main view: search + bookmark tree -->
    <section id="view-main" class="view">
      <div class="search">
        <input
          type="search"
          id="search-input"
          placeholder="Search bookmarks…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search bookmarks"
          data-i18n-attr="placeholder:searchPlaceholder,aria-label:searchLabel"
        />
      </div>

      <main
        id="tree"
        class="tree"
        tabindex="-1"
        aria-label="Bookmarks"
        data-i18n-attr="aria-label:bookmarks"
      ></main>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <!-- Settings view -->
    <section
      id="view-settings"
      class="view settings"
      hidden
      aria-label="Settings"
      data-i18n-attr="aria-label:settings"
    >
      <div class="settings-head">
        <button
          type="button"
          id="settings-back"
          class="icon-btn"
          aria-label="Back to bookmarks"
          title="Back"
          data-i18n-attr="aria-label:backLabel,title:backTitle"
        >
          <span aria-hidden="true">←</span>
        </button>
        <h2 data-i18n="settings">Settings</h2>
      </div>

      <div class="settings-body">
        <section class="group">
          <button
            type="button"
            class="group-header"
            aria-expanded="true"
            aria-controls="group-general"
          >
            <span class="twisty" aria-hidden="true">▾</span>
            <span class="group-title" data-i18n="groupGeneral">General</span>
          </button>
          <div class="group-content" id="group-general">
            <div class="setting">
              <label for="theme-select" data-i18n="themeLabel">Theme</label>
              <select id="theme-select" class="select">
                <option value="system" data-i18n="themeSystem">System</option>
                <option value="light" data-i18n="themeLight">Light</option>
                <option value="dark" data-i18n="themeDark">Dark</option>
              </select>
            </div>
            <div class="setting">
              <label for="language-select" data-i18n="languageLabel">Language</label>
              <select id="language-select" class="select">
                <option value="system" data-i18n="languageSystem">System</option>
                <option value="en" data-i18n="languageEnglish">English</option>
                <option value="sl" data-i18n="languageSlovenian">Slovenščina</option>
                <option value="de" data-i18n="languageGerman">Deutsch</option>
                <option value="fr" data-i18n="languageFrench">Français</option>
                <option value="es" data-i18n="languageSpanish">Español</option>
                <option value="hr" data-i18n="languageCroatian">Hrvatski</option>
                <option value="bs" data-i18n="languageBosnian">Bosanski</option>
                <option value="sr" data-i18n="languageSerbian">Српски</option>
                <option value="ru" data-i18n="languageRussian">Русский</option>
                <option value="hi" data-i18n="languageHindi">हिन्दी</option>
                <option value="ar" data-i18n="languageArabic">العربية</option>
                <option value="zh" data-i18n="languageChinese">简体中文</option>
              </select>
            </div>
          </div>
        </section>

        <section class="group">
          <button
            type="button"
            class="group-header"
            aria-expanded="false"
            aria-controls="group-behavior"
          >
            <span class="twisty" aria-hidden="true">▾</span>
            <span class="group-title" data-i18n="groupBehavior">Behavior</span>
          </button>
          <div class="group-content" id="group-behavior" hidden>
            <div class="setting">
              <label for="background-toggle">
                <span data-i18n="backgroundLabel">Open in background</span>
                <span class="hint" data-i18n="backgroundHint">Bookmarks open without closing the extension popup</span>
              </label>
              <label class="switch">
                <input type="checkbox" id="background-toggle" />
                <span class="switch-track" aria-hidden="true"></span>
              </label>
            </div>

            <div class="setting no-divider">
              <label>
                <span data-i18n="markingLabel">Bookmark bar functionality</span> <span id="marking-state"></span>
                <span class="hint" id="marking-hint"></span>
              </label>
              <button type="button" id="marking-toggle" class="btn"></button>
            </div>

            <div class="disclosure-wrap nested">
              <button
                type="button"
                id="perbookmark-toggle"
                class="disclosure"
                aria-expanded="false"
                aria-controls="perbookmark-panel"
              >
                <span class="twisty" aria-hidden="true">▾</span>
                <span class="disclosure-text">
                  <span class="disclosure-label" data-i18n="perBookmarkLabel">Per bookmark</span>
                  <span class="hint" data-i18n="perBookmarkHint">Override the switch above for individual bookmarks</span>
                </span>
              </button>
              <div id="perbookmark-panel" class="perbookmark-panel" hidden></div>
            </div>

            <div class="disclosure-wrap disclosure-wrap--engine">
              <button
                type="button"
                id="searchengine-toggle"
                class="disclosure disclosure--flush"
                aria-expanded="false"
                aria-controls="searchengine-panel"
              >
                <span class="disclosure-text">
                  <span class="disclosure-label" data-i18n="searchEngineLabel">Search engine behavior</span>
                  <span class="disclosure-hintrow">
                    <span class="twisty" aria-hidden="true">▾</span>
                    <span class="hint" data-i18n="searchEngineHint">On a search engine, on = new tab, off = same tab</span>
                  </span>
                </span>
              </button>
              <div id="searchengine-panel" class="searchengine-panel" hidden></div>
            </div>

            <div class="setting">
              <label for="samesite-toggle">
                <span data-i18n="sameSiteLabel">Same-site in current tab</span>
                <span class="hint" data-i18n="sameSiteHint">When a bookmark points to the site you're already on, open it in same tab</span>
              </label>
              <label class="switch">
                <input type="checkbox" id="samesite-toggle" />
                <span class="switch-track" aria-hidden="true"></span>
              </label>
            </div>
          </div>
        </section>
      </div>

      <footer class="settings-footer">
        <p id="delete-confirm" class="delete-confirm" hidden data-i18n="deleteConfirm">
          Are you sure? This restores your bookmarks and removes BookmarkUp -
          it can't be undone.
        </p>
        <div class="delete-row">
          <button
            type="button"
            id="delete-cancel"
            class="icon-btn"
            hidden
            aria-label="Keep the extension"
            title="Keep the extension"
            data-i18n-attr="aria-label:keepLabel,title:keepLabel"
          >
            <span aria-hidden="true">←</span>
          </button>
          <button type="button" id="delete-data" class="btn btn-delete" data-i18n="deleteButton">
            Delete extension
          </button>
        </div>
        <p id="settings-status" class="status" role="status" aria-live="polite"></p>
      </footer>
    </section>

    <!-- About view -->
    <section
      id="view-about"
      class="view about"
      hidden
      aria-label="About"
      data-i18n-attr="aria-label:about"
    >
      <div class="settings-head">
        <button
          type="button"
          id="about-back"
          class="icon-btn"
          aria-label="Back to bookmarks"
          title="Back"
          data-i18n-attr="aria-label:backLabel,title:backTitle"
        >
          <span aria-hidden="true">←</span>
        </button>
        <h2 data-i18n="about">About</h2>
      </div>

      <div class="about-body">
        <div class="about-identity">
          <img
            src="../../icons/icon-128.png"
            width="64"
            height="64"
            alt=""
            class="about-logo"
          />
          <h3 class="about-name">BookmarkUp</h3>
          <p id="about-version" class="about-version"></p>
          <p class="about-tagline" data-i18n="aboutTagline">
            Open any bookmark in a new tab with a single left click.
          </p>
        </div>

        <nav class="about-links">
          <a
            class="about-link"
            href="https://neratmatevz.github.io/BookmarkUp/"
            target="_blank"
            rel="noopener"
            aria-label="Website"
            title="Website"
            data-i18n-attr="aria-label:aboutWebsite,title:aboutWebsite"
          >
            <span class="about-icon" aria-hidden="true">🌐</span>
          </a>
          <a
            class="about-link"
            href="https://github.com/neratmatevz/BookmarkUp"
            target="_blank"
            rel="noopener"
            aria-label="Source code"
            title="Source code"
            data-i18n-attr="aria-label:aboutSource,title:aboutSource"
          >
            <svg
              class="about-icon"
              viewBox="0 0 16 16"
              width="20"
              height="20"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
            </svg>
          </a>
          <a
            class="about-link"
            href="https://ko-fi.com/L4O426TJKI"
            target="_blank"
            rel="noopener"
            aria-label="Support (Ko-fi)"
            title="Support (Ko-fi)"
            data-i18n-attr="aria-label:aboutSupport,title:aboutSupport"
          >
            <span class="about-icon" aria-hidden="true">☕</span>
          </a>
        </nav>

        <p class="about-license" data-i18n="aboutLicense">
          Released under the MIT License.
        </p>
      </div>
    </section>

    <script src="popup.js" type="module"></script>
  </body>
</html>
