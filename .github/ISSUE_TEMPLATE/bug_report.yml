name: Bug report
description: Something isn't working right in BookmarkUp
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please make sure you're on the latest version first.
  - type: input
    id: version
    attributes:
      label: BookmarkUp version
      description: Shown on your browser's extensions page.
      placeholder: e.g. 1.3.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Brave
        - Edge
        - Other Chromium
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: e.g. 128
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Screenshots or console errors (optional)
      description: >
        Popup errors: right-click the popup -> Inspect -> Console.
        Service worker: your browser's extensions page -> "Inspect views: service worker".
