# SonarQube Cloud analysis - MAINTAINER-TRIGGERED via a `/sonar` comment.
#
# It runs only when a maintainer comments `/sonar` on a pull request. The comment
# path is gated on author_association, so external
# contributors can't start it. It does NOT run on every opened PR.
#
# Re-run after new commits: `/sonar` again.

name: Sonar

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/sonar') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    environment: sonar
    steps:
      # The comment payload has no commit, so look the PR up by number to get the
      # exact head commit to analyze.
      - name: Resolve PR head commit
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.head.sha);

      - name: Check out the PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
